name: Build and Test Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - '**/Dockerfile*'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Dockerfile*'
      - '.github/workflows/build-and-test.yml'
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to build (e.g., flutter, python, all)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dev-workspaces

jobs:
  find-changes:
    name: Find changed Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed or all Dockerfiles
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ github.event.inputs.stack }}" != "all" ]]; then
            # Manual trigger for specific stack
            stack="${{ github.event.inputs.stack }}"
            dockerfiles=$(find "$stack" -name "Dockerfile*" -not -path "./legacy/*" 2>/dev/null || echo "[]")
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Find changed files in PR
            dockerfiles=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '^[^/]+/[^/]+/Dockerfile.*$' | grep -v '^legacy/' || echo "")
          else
            # Push to main - find all recently changed
            dockerfiles=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD | grep -E '^[^/]+/[^/]+/Dockerfile.*$' | grep -v '^legacy/' || echo "")
          fi
          
          # Build matrix
          matrix_json="[]"
          if [[ ! -z "$dockerfiles" ]]; then
            matrix_json=$(echo "$dockerfiles" | while read dockerfile; do
              if [[ -f "$dockerfile" ]]; then
                dir=$(dirname "$dockerfile")
                stack=$(echo "$dir" | cut -d'/' -f1)
                version=$(echo "$dir" | cut -d'/' -f2)
                echo "{\"dockerfile\":\"$dockerfile\",\"stack\":\"$stack\",\"version\":\"$version\",\"context\":\"$dir\"}"
              fi
            done | jq -s '.')
          fi
          
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "has-changes=$([[ "$matrix_json" != "[]" ]] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          
          echo "Build matrix:"
          echo "$matrix_json" | jq '.'

  build-test:
    name: Build ${{ matrix.stack }}:${{ matrix.version }}
    needs: find-changes
    if: needs.find-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.find-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.stack }}:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.stack }}:${{ matrix.version }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image for testing
        run: |
          docker load --input /tmp/image.tar
          docker images

      - name: Test basic functionality
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.stack }}:${{ matrix.version }}"
          echo "Testing image: $IMAGE"
          
          # Basic container run test
          docker run --rm $IMAGE echo "Container started successfully"
          
          # Check for required directories
          docker run --rm $IMAGE test -d /workspace || echo "WARNING: /workspace directory not found"
          
          # Stack-specific tests
          case "${{ matrix.stack }}" in
            flutter)
              docker run --rm $IMAGE flutter --version || echo "Flutter not properly installed"
              ;;
            python)
              docker run --rm $IMAGE python --version || echo "Python not properly installed"
              ;;
            golang)
              docker run --rm $IMAGE go version || echo "Go not properly installed"
              ;;
            react-native)
              docker run --rm $IMAGE npm --version || echo "npm not properly installed"
              ;;
            nextjs)
              docker run --rm $IMAGE node --version || echo "Node.js not properly installed"
              ;;
            bun)
              docker run --rm $IMAGE bun --version || echo "Bun not properly installed"
              ;;
            deno)
              docker run --rm $IMAGE deno --version || echo "Deno not properly installed"
              ;;
            android)
              docker run --rm $IMAGE test -d "$ANDROID_HOME" || echo "Android SDK not properly installed"
              ;;
          esac

      - name: Test multi-platform compatibility
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.stack }}:${{ matrix.version }}"
          
          # Test Gitpod user
          docker run --rm -u gitpod $IMAGE whoami 2>/dev/null || echo "Gitpod user not available"
          
          # Test vscode user
          docker run --rm -u vscode $IMAGE whoami 2>/dev/null || echo "VSCode user not available"
          
          # Test workspace permissions
          docker run --rm $IMAGE touch /workspace/test 2>/dev/null || echo "Cannot write to /workspace"

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail the build on vulnerabilities during testing

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test-summary:
    name: Test Summary
    needs: [find-changes, build-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Build and Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.find-changes.outputs.has-changes }}" != "true" ]]; then
            echo "ℹ️ No Dockerfile changes detected." >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-test.result }}" == "success" ]]; then
            echo "✅ All Docker images built and tested successfully!" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-test.result }}" == "skipped" ]]; then
            echo "⏭️ Build and test skipped." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some Docker images failed to build or test." >> $GITHUB_STEP_SUMMARY
          fi